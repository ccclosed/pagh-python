[package]
name = "pythonc"
version = "0.9.1"
edition = "2021"
publish = false
description = "A native Python interpreter for the pagh-riscv native ABI (generators, yield from, decorators, % formatting, variadics, str.format, lambda, with, set, bytes, f-strings, os, json, time, random, os.path)"

[[bin]]
name = "pythonc"
path = "src/main.rs"

# Sibling checkout, exactly like pagh-programs/programs/Cargo.toml. There is no
# fallback for a path dependency: check out pagh-api next to this repository.
[dependencies]
libpagh = { path = "../pagh-api/libpagh" }

# Userland is freestanding: no unwinder, no relocations, one static ELF. The
# kernel refuses images above 1 MiB and does not load debug info, so stripping
# it matters. `overflow-checks = false` is deliberate: the interpreter performs
# every arithmetic operation with explicit `checked_*` calls and raises a
# Python `OverflowError` instead of aborting the process on user data.
[profile.release]
panic = "abort"
opt-level = 2
debug = false
# `strip = "symbols"` (not just debug info): the kernel loads the ELF through
# its program headers and never reads the symbol table, and the table alone was
# ~540 KiB of a file the kernel refuses above 1 MiB.
strip = "symbols"
lto = false
codegen-units = 1
overflow-checks = false

[profile.dev]
panic = "abort"
opt-level = 1
debug = false
strip = "symbols"
overflow-checks = false